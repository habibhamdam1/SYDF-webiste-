<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery - SYDF</title>
    <script src="js/head-includes.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
      .page-hero {
        min-height: 40vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 140px 20px 60px;
      }
      .page-hero-content {
        text-align: center;
        padding: 40px 60px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
      }
      .page-hero-content h1 {
        font-size: 44px;
        color: #1abc9c;
        margin-bottom: 10px;
      }
      .page-hero-content p {
        font-size: 14px;
        opacity: 0.8;
        color: white;
      }

      .gallery-section {
        padding: 40px;
        max-width: 1300px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 25px;
      }
      .glass-block {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        padding: 40px;
      }
      .intro-block {
        text-align: center;
      }
      .intro-block h2 {
        font-size: 30px;
        color: #1abc9c;
        margin-bottom: 20px;
      }
      .intro-block p {
        font-size: 16px;
        line-height: 1.9;
        opacity: 0.9;
        color: white;
      }

      /* Album cards */
      .albums-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 22px;
      }

      .album-card {
        position: relative;
        height: 240px;
        border-radius: 18px;
        overflow: hidden;
        cursor: pointer;
        transition: 0.4s;
        background: linear-gradient(
          135deg,
          rgba(26, 188, 156, 0.2),
          rgba(15, 32, 39, 0.4)
        );
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .album-card:hover {
        transform: translateY(-6px);
        border-color: rgba(26, 188, 156, 0.4);
        box-shadow: 0 25px 60px rgba(26, 188, 156, 0.25);
      }
      .album-cover {
        position: absolute;
        inset: 0;
        object-fit: cover;
        width: 100%;
        height: 100%;
        transition: 0.5s;
      }
      .album-card:hover .album-cover {
        transform: scale(1.08);
      }
      .album-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 72px;
        background: linear-gradient(
          135deg,
          rgba(26, 188, 156, 0.25),
          rgba(15, 32, 39, 0.5)
        );
      }
      .album-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          transparent 40%,
          rgba(0, 0, 0, 0.85) 100%
        );
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 22px;
        z-index: 2;
      }
      .album-name {
        font-size: 18px;
        font-weight: 700;
        color: white;
        margin-bottom: 6px;
        line-height: 1.3;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
      .album-meta {
        font-size: 12px;
        color: #5eead4;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .album-count-badge {
        position: absolute;
        top: 15px;
        right: 15px;
        padding: 6px 14px;
        background: rgba(26, 188, 156, 0.85);
        backdrop-filter: blur(10px);
        border-radius: 18px;
        font-size: 11px;
        font-weight: 800;
        color: white;
        letter-spacing: 1px;
        z-index: 3;
      }

      .loading-state,
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: white;
        opacity: 0.75;
        grid-column: 1/-1;
      }
      .loading-state .spinner {
        width: 46px;
        height: 46px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #1abc9c;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 18px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 768px) {
        .page-hero-content h1 {
          font-size: 32px;
        }
        .page-hero-content {
          padding: 30px 25px;
        }
        .gallery-section {
          padding: 20px;
        }
        .glass-block {
          padding: 25px 20px;
        }
        .albums-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="glass-header">
      <div class="logo">
        <h1>SYDF</h1>
        <p>Swat Youth Development Forum</p>
      </div>
      <nav></nav>
    </header>

    <section class="page-hero">
      <div class="page-hero-content">
        <h1>📷 Gallery</h1>
        <p>Home / Gallery</p>
      </div>
    </section>

    <section class="gallery-section">
      <div class="glass-block intro-block">
        <h2>Moments That Matter</h2>
        <p>
          Explore our journey through photos — activities, events, and memorable
          moments from SYDF.
        </p>
      </div>

      <div class="glass-block">
        <div id="albumsGrid" class="albums-grid">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading albums...</p>
          </div>
        </div>
      </div>
    </section>

    <footer class="glass-footer"></footer>

    <script src="js/main.js"></script>
    <script>
      function escapeHtml(s) {
        return String(s || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function prettifyAlbumName(name) {
        return String(name || "general")
          .replace(/[_-]/g, " ")
          .replace(/\b\w/g, (c) => c.toUpperCase());
      }

      function renderAlbums(groups) {
        const grid = document.getElementById("albumsGrid");
        const albums = Object.keys(groups);

        if (albums.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <div style="font-size:60px; margin-bottom:15px; opacity:0.5;">📷</div>
              <h3>No Albums Yet</h3>
              <p>Photos will appear here once added to the gallery.</p>
            </div>`;
          return;
        }

        grid.innerHTML = albums
          .map((albumName) => {
            const photos = groups[albumName];
            const cover = photos.find((p) => p.image_url);
            const count = photos.length;
            const coverHTML = cover
              ? `<img class="album-cover" src="${escapeHtml(cover.image_url)}" alt="${escapeHtml(albumName)}" onerror="this.remove()">`
              : `<div class="album-placeholder">📷</div>`;

            return `
            <div class="album-card" onclick="window.location.href='gallery-album.html?album=${encodeURIComponent(albumName)}'">
              ${coverHTML}
              <div class="album-count-badge">${count} ${count === 1 ? "PHOTO" : "PHOTOS"}</div>
              <div class="album-overlay">
                <div class="album-name">${escapeHtml(prettifyAlbumName(albumName))}</div>
                <div class="album-meta">📷 View Album</div>
              </div>
            </div>`;
          })
          .join("");
      }

      window.addEventListener("load", async function () {
        let attempts = 0;
        while (
          (typeof supabaseClient === "undefined" || !supabaseClient) &&
          attempts < 30
        ) {
          await new Promise((r) => setTimeout(r, 100));
          attempts++;
        }
        if (!supabaseClient) {
          document.getElementById("albumsGrid").innerHTML =
            '<div class="empty-state"><h3>⚠️ System Not Ready</h3><p>Please refresh the page.</p></div>';
          return;
        }

        try {
          const { data, error } = await supabaseClient
            .from("gallery")
            .select("*")
            .order("created_at", { ascending: false });

          if (error) throw error;

          // Group by album
          const groups = {};
          (data || []).forEach((p) => {
            if (p.status && p.status !== "Published") return;
            const key = p.album || "general";
            if (!groups[key]) groups[key] = [];
            groups[key].push(p);
          });

          renderAlbums(groups);
        } catch (err) {
          console.error(err);
          document.getElementById("albumsGrid").innerHTML =
            '<div class="empty-state"><h3>❌ Error Loading Gallery</h3><p>Please refresh the page.</p></div>';
        }
      });
    </script>
  </body>
</html>
