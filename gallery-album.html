<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery Album - SYDF</title>
    <script src="js/head-includes.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
      .album-hero {
        padding: 140px 20px 30px;
        max-width: 1300px;
        margin: 0 auto;
      }
      .breadcrumb {
        font-size: 13px;
        opacity: 0.7;
        color: white;
        margin-bottom: 20px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .breadcrumb a {
        color: #1abc9c;
        text-decoration: none;
      }
      .breadcrumb a:hover {
        text-decoration: underline;
      }

      .album-header {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        padding: 35px 45px;
        margin-bottom: 30px;
        text-align: center;
      }
      .album-header h1 {
        font-family: "Playfair Display", serif;
        font-size: 38px;
        color: #1abc9c;
        margin-bottom: 10px;
        font-weight: 700;
      }
      .album-header p {
        font-size: 15px;
        opacity: 0.85;
        color: white;
        line-height: 1.7;
        max-width: 700px;
        margin: 0 auto;
      }
      .album-count {
        display: inline-block;
        margin-top: 15px;
        padding: 6px 16px;
        background: rgba(26, 188, 156, 0.15);
        border: 1px solid rgba(26, 188, 156, 0.4);
        border-radius: 18px;
        color: #5eead4;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      /* Photo grid */
      .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
      }
      .photo-item {
        position: relative;
        aspect-ratio: 4/3;
        border-radius: 14px;
        overflow: hidden;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: 0.4s;
      }
      .photo-item:hover {
        transform: scale(1.02);
        border-color: rgba(26, 188, 156, 0.4);
        box-shadow: 0 15px 40px rgba(26, 188, 156, 0.25);
        z-index: 2;
      }
      .photo-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: 0.4s;
      }
      .photo-item:hover img {
        transform: scale(1.06);
      }
      .photo-item .placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 60px;
        background: linear-gradient(
          135deg,
          rgba(26, 188, 156, 0.15),
          rgba(15, 32, 39, 0.3)
        );
      }
      .photo-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 30px 15px 14px;
        background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.85));
        color: white;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
        transform: translateY(100%);
        transition: 0.3s;
        opacity: 0;
      }
      .photo-item:hover .photo-caption {
        transform: translateY(0);
        opacity: 1;
      }

      /* Lightbox */
      .lightbox {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        backdrop-filter: blur(10px);
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 30px;
      }
      .lightbox.active {
        display: flex;
      }
      .lb-image {
        max-width: 90%;
        max-height: 85vh;
        border-radius: 12px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        animation: lbZoom 0.3s ease;
      }
      @keyframes lbZoom {
        from {
          transform: scale(0.9);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .lb-caption {
        position: absolute;
        bottom: 30px;
        left: 0;
        right: 0;
        text-align: center;
        color: white;
        font-size: 15px;
        font-weight: 500;
        padding: 0 30px;
      }
      .lb-close {
        position: absolute;
        top: 20px;
        right: 25px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        font-size: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.3s;
      }
      .lb-close:hover {
        background: rgba(239, 68, 68, 0.8);
        transform: rotate(90deg);
      }
      .lb-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        font-size: 22px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.3s;
      }
      .lb-nav:hover {
        background: rgba(26, 188, 156, 0.6);
      }
      .lb-prev {
        left: 25px;
      }
      .lb-next {
        right: 25px;
      }

      .loading-state,
      .empty-state {
        text-align: center;
        padding: 70px 20px;
        color: white;
        opacity: 0.75;
        grid-column: 1 / -1;
      }
      .loading-state .spinner {
        width: 46px;
        height: 46px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #1abc9c;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 18px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .back-btn-wrap {
        text-align: center;
        margin-top: 30px;
      }
      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 28px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        color: white;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: 0.3s;
      }
      .back-btn:hover {
        background: rgba(26, 188, 156, 0.15);
        border-color: #1abc9c;
        transform: translateY(-2px);
      }

      @media (max-width: 768px) {
        .album-hero {
          padding: 120px 15px 20px;
        }
        .album-header {
          padding: 25px 22px;
        }
        .album-header h1 {
          font-size: 26px;
        }
        .photo-grid {
          grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
          gap: 12px;
        }
        .lb-nav {
          width: 42px;
          height: 42px;
          font-size: 18px;
        }
        .lb-prev {
          left: 10px;
        }
        .lb-next {
          right: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header class="glass-header">
      <div class="logo">
        <h1>SYDF</h1>
        <p>Swat Youth Development Forum</p>
      </div>
      <nav></nav>
    </header>

    <section class="album-hero">
      <div class="breadcrumb">
        <a href="index.html">Home</a>
        <span>/</span>
        <a href="gallery.html">Gallery</a>
        <span>/</span>
        <span id="crumbAlbum">Album</span>
      </div>
      <div id="albumContent">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Loading album...</p>
        </div>
      </div>
    </section>

    <div
      id="lightbox"
      class="lightbox"
      onclick="if (event.target === this) closeLightbox();"
    >
      <button class="lb-close" onclick="closeLightbox()">✕</button>
      <button
        class="lb-nav lb-prev"
        onclick="
          event.stopPropagation();
          navLightbox(-1);
        "
      >
        ‹
      </button>
      <img id="lbImage" class="lb-image" src="" alt="" />
      <button
        class="lb-nav lb-next"
        onclick="
          event.stopPropagation();
          navLightbox(1);
        "
      >
        ›
      </button>
      <div class="lb-caption" id="lbCaption"></div>
    </div>

    <footer class="glass-footer"></footer>

    <script src="js/main.js"></script>
    <script>
      let allPhotos = [];
      let currentIndex = 0;

      function formatDate(d) {
        if (!d) return "-";
        try {
          return new Date(d).toLocaleDateString("en-PK", {
            day: "numeric",
            month: "short",
            year: "numeric",
          });
        } catch {
          return "-";
        }
      }
      function escapeHtml(s) {
        return String(s || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function getParam(name) {
        return new URLSearchParams(window.location.search).get(name);
      }

      function renderAlbum(photos, albumName) {
        const content = document.getElementById("albumContent");
        document.getElementById("crumbAlbum").textContent = albumName;

        if (photos.length === 0) {
          content.innerHTML = `
            <div class="album-header">
              <h1>📷 ${escapeHtml(albumName)}</h1>
              <p>No photos in this album yet.</p>
            </div>
            <div class="back-btn-wrap">
              <a href="gallery.html" class="back-btn">← Back to Gallery</a>
            </div>`;
          return;
        }

        const photoHTML = photos
          .map((p, i) => {
            const imgHTML = p.image_url
              ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.title || "Photo")}" loading="lazy" onerror="this.outerHTML='<div class=\\'placeholder\\'>🖼️</div>'">`
              : `<div class="placeholder">🖼️</div>`;
            const caption = p.title || p.description || "";
            return `
            <div class="photo-item" onclick="openLightbox(${i})">
              ${imgHTML}
              ${caption ? `<div class="photo-caption">${escapeHtml(caption)}</div>` : ""}
            </div>`;
          })
          .join("");

        content.innerHTML = `
          <div class="album-header">
            <h1>📷 ${escapeHtml(albumName)}</h1>
            <p>${photos.length} ${photos.length === 1 ? "photo" : "photos"} in this album</p>
            <div class="album-count">${photos.length} PHOTO${photos.length !== 1 ? "S" : ""}</div>
          </div>
          <div class="photo-grid">${photoHTML}</div>
          <div class="back-btn-wrap">
            <a href="gallery.html" class="back-btn">← Back to Gallery</a>
          </div>`;
      }

      function openLightbox(index) {
        currentIndex = index;
        const p = allPhotos[index];
        if (!p || !p.image_url) return;
        document.getElementById("lbImage").src = p.image_url;
        document.getElementById("lbCaption").textContent =
          p.title || p.description || "";
        document.getElementById("lightbox").classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        document.getElementById("lightbox").classList.remove("active");
        document.body.style.overflow = "";
      }

      function navLightbox(dir) {
        if (allPhotos.length === 0) return;
        currentIndex =
          (currentIndex + dir + allPhotos.length) % allPhotos.length;
        // Skip photos without image_url
        let tries = 0;
        while (!allPhotos[currentIndex].image_url && tries < allPhotos.length) {
          currentIndex =
            (currentIndex + dir + allPhotos.length) % allPhotos.length;
          tries++;
        }
        const p = allPhotos[currentIndex];
        if (p.image_url) {
          document.getElementById("lbImage").src = p.image_url;
          document.getElementById("lbCaption").textContent =
            p.title || p.description || "";
        }
      }

      document.addEventListener("keydown", function (e) {
        if (!document.getElementById("lightbox").classList.contains("active"))
          return;
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowLeft") navLightbox(-1);
        if (e.key === "ArrowRight") navLightbox(1);
      });

      window.addEventListener("load", async function () {
        let attempts = 0;
        while (
          (typeof supabaseClient === "undefined" || !supabaseClient) &&
          attempts < 30
        ) {
          await new Promise((r) => setTimeout(r, 100));
          attempts++;
        }
        if (!supabaseClient) {
          document.getElementById("albumContent").innerHTML =
            '<div class="empty-state"><h3>⚠️ System Not Ready</h3><p>Please refresh the page.</p></div>';
          return;
        }

        const album = getParam("album");
        if (!album) {
          document.getElementById("albumContent").innerHTML =
            '<div class="empty-state"><h3>📷 No album selected</h3><p>Please choose an album from the gallery.</p><div class="back-btn-wrap"><a href="gallery.html" class="back-btn">← Back to Gallery</a></div></div>';
          return;
        }

        try {
          const { data, error } = await supabaseClient
            .from("gallery")
            .select("*")
            .eq("album", album)
            .order("created_at", { ascending: false });

          if (error) throw error;
          allPhotos = (data || []).filter(
            (p) => !p.status || p.status === "Published",
          );
          const albumName = album
            .replace(/_/g, " ")
            .replace(/\b\w/g, (c) => c.toUpperCase());
          renderAlbum(allPhotos, albumName);
        } catch (err) {
          console.error(err);
          document.getElementById("albumContent").innerHTML =
            '<div class="empty-state"><h3>❌ Error Loading Album</h3><p>Please refresh the page.</p></div>';
        }
      });

      window.openLightbox = openLightbox;
      window.closeLightbox = closeLightbox;
      window.navLightbox = navLightbox;
    </script>
  </body>
</html>
