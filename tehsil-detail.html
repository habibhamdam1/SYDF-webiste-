<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tehsil Details - SYDF</title>
    <script src="js/head-includes.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
      .detail-hero {
        padding: 140px 20px 30px;
        max-width: 1000px;
        margin: 0 auto;
      }
      .breadcrumb {
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 20px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .breadcrumb a {
        color: var(--accent);
        text-decoration: none;
      }
      .breadcrumb a:hover {
        text-decoration: underline;
      }

      .tehsil-header-card {
        background: linear-gradient(
          135deg,
          var(--accent-soft, rgba(26, 188, 156, 0.15)),
          var(--glass-bg, rgba(255, 255, 255, 0.08))
        );
        backdrop-filter: blur(15px);
        border: 1px solid var(--card-border, rgba(255, 255, 255, 0.15));
        border-radius: 24px;
        padding: 45px 50px;
        margin-bottom: 30px;
        position: relative;
        overflow: hidden;
        text-align: center;
      }
      .tehsil-header-card::before {
        content: "";
        position: absolute;
        top: -50%;
        right: -20%;
        width: 350px;
        height: 350px;
        background: radial-gradient(
          circle,
          rgba(26, 188, 156, 0.2),
          transparent 70%
        );
        border-radius: 50%;
        pointer-events: none;
      }
      .tehsil-icon {
        font-size: 64px;
        margin-bottom: 15px;
        display: block;
        position: relative;
      }
      .tehsil-header-card h1 {
        font-family: "Playfair Display", serif;
        font-size: 42px;
        color: var(--text-primary) !important;
        margin-bottom: 10px;
        line-height: 1.15;
        position: relative;
      }
      .district-pill {
        display: inline-block;
        padding: 7px 18px;
        background: rgba(59, 130, 246, 0.15);
        border: 1px solid rgba(59, 130, 246, 0.4);
        border-radius: 18px;
        color: #3b82f6;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        position: relative;
        text-decoration: none;
        transition: 0.3s;
      }
      [data-theme="dark"] .district-pill {
        color: #93c5fd;
      }
      .district-pill:hover {
        background: rgba(59, 130, 246, 0.3);
        color: white;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-top: 30px;
        position: relative;
        z-index: 2;
      }
      .stat-card {
        background: var(--glass-bg, rgba(255, 255, 255, 0.06));
        border: 1px solid var(--card-border, rgba(255, 255, 255, 0.12));
        border-radius: 16px;
        padding: 20px;
        text-align: center;
      }
      .stat-icon {
        font-size: 30px;
        margin-bottom: 8px;
        display: block;
      }
      .stat-num {
        font-size: 28px;
        font-weight: 800;
        color: var(--accent);
        line-height: 1;
      }
      .stat-lbl {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-secondary);
        margin-top: 6px;
        font-weight: 600;
      }

      .section-card {
        background: var(--glass-bg, rgba(255, 255, 255, 0.08));
        backdrop-filter: blur(15px);
        border: 1px solid var(--card-border, rgba(255, 255, 255, 0.15));
        border-radius: 20px;
        padding: 35px 40px;
        margin-bottom: 25px;
      }
      .section-title {
        font-size: 22px;
        color: var(--accent);
        margin-bottom: 22px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .info-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        background: var(--input-bg, rgba(255, 255, 255, 0.05));
        border: 1px solid var(--card-border, rgba(255, 255, 255, 0.1));
        border-radius: 12px;
        margin-bottom: 10px;
      }
      .info-icon {
        font-size: 22px;
        flex-shrink: 0;
      }
      .info-txt {
        color: var(--text-primary);
        font-size: 14px;
      }
      .info-txt strong {
        color: var(--accent);
      }

      .cta-card {
        text-align: center;
        background: linear-gradient(
          135deg,
          var(--accent-soft, rgba(26, 188, 156, 0.15)),
          var(--glass-bg, rgba(255, 255, 255, 0.05))
        );
        border: 1px solid var(--accent);
      }
      .cta-card h2 {
        color: var(--accent);
        font-size: 24px;
        margin-bottom: 12px;
      }
      .cta-card p {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: 22px;
      }
      .btn-cta {
        display: inline-block;
        padding: 13px 30px;
        background: linear-gradient(135deg, var(--accent), #16a085);
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        transition: 0.3s;
      }
      .btn-cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(26, 188, 156, 0.4);
      }

      .loading-wrap,
      .notfound-wrap {
        text-align: center;
        padding: 100px 30px;
        max-width: 700px;
        margin: 0 auto;
        color: var(--text-primary);
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid var(--card-border, rgba(255, 255, 255, 0.15));
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .notfound-wrap .ico {
        font-size: 70px;
        margin-bottom: 20px;
        display: block;
      }
      .notfound-wrap h2 {
        font-size: 24px;
        color: var(--text-primary);
        margin-bottom: 10px;
      }
      .notfound-wrap p {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: 25px;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--accent);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: 0.3s;
      }
      .back-link:hover {
        transform: translateX(-4px);
      }

      @media (max-width: 768px) {
        .detail-hero {
          padding: 120px 15px 20px;
        }
        .tehsil-header-card {
          padding: 30px 22px;
        }
        .tehsil-header-card h1 {
          font-size: 26px;
        }
        .tehsil-icon {
          font-size: 48px;
        }
        .section-card {
          padding: 25px 20px;
        }
      }
    </style>
  </head>
  <body>
    <header class="glass-header">
      <div class="logo">
        <h1>SYDF</h1>
        <p>Swat Youth Development Forum</p>
      </div>
      <nav></nav>
    </header>

    <section class="detail-hero">
      <div class="breadcrumb">
        <a href="index.html">Home</a>
        <span>/</span>
        <a href="districts.html">Districts</a>
        <span>/</span>
        <a href="#" id="districtCrumb">District</a>
        <span>/</span>
        <span id="crumbTitle">Tehsil</span>
      </div>
      <div id="content">
        <div class="loading-wrap">
          <div class="spinner"></div>
          <h2>Loading tehsil...</h2>
          <p>Please wait</p>
        </div>
      </div>
    </section>

    <footer class="glass-footer"></footer>

    <script src="js/main.js"></script>
    <script>
      function escapeHtml(s) {
        return String(s || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function getParam(n) {
        return new URLSearchParams(window.location.search).get(n);
      }

      function renderNotFound(msg) {
        document.getElementById("content").innerHTML = `
          <div class="section-card notfound-wrap">
            <span class="ico">📍</span>
            <h2>Tehsil Not Found</h2>
            <p>${escapeHtml(msg || "This tehsil may have been removed or the link is invalid.")}</p>
            <a href="districts.html" class="back-link">← Back to Districts</a>
          </div>`;
      }

      function renderTehsil(tehsil, district, memberCount, coordinators) {
        document.getElementById("crumbTitle").textContent = tehsil.name;

        if (district) {
          const dc = document.getElementById("districtCrumb");
          dc.textContent = district.name;
          dc.setAttribute("href", `district-detail.html?id=${district.id}`);
        }

        const coordHTML =
          coordinators.length > 0
            ? coordinators
                .map(
                  (c) => `
            <div class="info-row">
              <span class="info-icon">👤</span>
              <span class="info-txt"><strong>${escapeHtml(c.name)}</strong> — ${escapeHtml(c.role || "Coordinator")}</span>
            </div>`,
                )
                .join("")
            : `<div class="info-row" style="background:rgba(245,158,11,0.08);border:1px dashed rgba(245,158,11,0.4);">
              <span class="info-icon">⚠️</span>
              <span class="info-txt" style="color:#d97706;font-weight:600;">Coordinator not assigned yet</span>
            </div>`;

        const districtLink = district
          ? `<a href="district-detail.html?id=${district.id}" class="district-pill">📍 In ${escapeHtml(district.name)} District</a>`
          : "";

        document.getElementById("content").innerHTML = `
          <div class="tehsil-header-card">
            <span class="tehsil-icon">📍</span>
            <h1>${escapeHtml(tehsil.name)}</h1>
            ${districtLink}

            <div class="stat-grid">
              <div class="stat-card">
                <span class="stat-icon">👥</span>
                <div class="stat-num">${memberCount}</div>
                <div class="stat-lbl">Members</div>
              </div>
              <div class="stat-card">
                <span class="stat-icon">🏛️</span>
                <div class="stat-num" style="font-size:18px;">${district ? escapeHtml(district.name) : "-"}</div>
                <div class="stat-lbl">District</div>
              </div>
            </div>
          </div>

          <div class="section-card">
            <h2 class="section-title">👤 Tehsil Leadership</h2>
            ${coordHTML}
          </div>

          <div class="section-card">
            <h2 class="section-title">ℹ️ About This Tehsil</h2>
            <div class="info-row">
              <span class="info-icon">📍</span>
              <span class="info-txt">Tehsil: <strong>${escapeHtml(tehsil.name)}</strong></span>
            </div>
            ${
              district
                ? `<div class="info-row"><span class="info-icon">🗺️</span><span class="info-txt">District: <strong>${escapeHtml(district.name)}</strong> (${escapeHtml(district.division || "Malakand")} Division)</span></div>`
                : ""
            }
            <div class="info-row">
              <span class="info-icon">👥</span>
              <span class="info-txt">Active Members: <strong>${memberCount}</strong></span>
            </div>
          </div>

          <div class="section-card cta-card">
            <h2>Join SYDF ${escapeHtml(tehsil.name)}</h2>
            <p>Become a member and help us develop youth in your area.</p>
            <a href="membership.html" class="btn-cta">Join Us Today</a>
          </div>

          <div style="text-align:center;margin-top:20px;">
            <a href="districts.html" class="back-link">← Back to Districts</a>
          </div>
        `;
      }

      window.addEventListener("load", async function () {
        let attempts = 0;
        while (
          (typeof supabaseClient === "undefined" || !supabaseClient) &&
          attempts < 30
        ) {
          await new Promise((r) => setTimeout(r, 100));
          attempts++;
        }
        if (!supabaseClient) {
          renderNotFound("System not ready. Please refresh.");
          return;
        }

        const id = getParam("id");
        if (!id) {
          renderNotFound("No tehsil selected.");
          return;
        }

        try {
          const { data: tehsil, error } = await supabaseClient
            .from("tehsils")
            .select("*")
            .eq("id", id)
            .single();

          if (error || !tehsil) {
            renderNotFound();
            return;
          }

          let district = null;
          if (tehsil.district_id) {
            const { data: d } = await supabaseClient
              .from("districts")
              .select("*")
              .eq("id", tehsil.district_id)
              .single();
            district = d;
          }

          let membersCount = 0;
          let coordinators = [];
          if (district) {
            const [memRes, coordRes] = await Promise.all([
              supabaseClient
                .from("members")
                .select("id")
                .eq("district", district.name)
                .eq("tehsil", tehsil.name)
                .eq("status", "Active"),
              supabaseClient
                .from("members")
                .select("name, role")
                .eq("district", district.name)
                .eq("tehsil", tehsil.name)
                .in("role", [
                  "Tehsil Coordinator",
                  "Chief Organizer",
                  "Coordinator",
                ]),
            ]);
            membersCount = (memRes.data || []).length;
            coordinators = coordRes.data || [];
          }

          renderTehsil(tehsil, district, membersCount, coordinators);
        } catch (err) {
          console.error(err);
          renderNotFound("Something went wrong while loading the tehsil.");
        }
      });
    </script>
  </body>
</html>
