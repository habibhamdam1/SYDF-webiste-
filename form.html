<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form - SYDF</title>
    <script src="js/head-includes.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
      .form-hero {
        padding: 140px 20px 40px;
        text-align: center;
        max-width: 800px;
        margin: 0 auto;
      }
      .form-hero h1 {
        font-family: "Playfair Display", serif;
        font-size: 42px;
        color: var(--accent);
        margin-bottom: 15px;
      }

      .form-container {
        max-width: 700px;
        margin: 0 auto 80px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(225, 29, 72, 0.15);
        border-radius: 20px;
        backdrop-filter: blur(10px);
      }
      html[data-theme="dark"] .form-container {
        background: rgba(12, 24, 42, 0.55);
        border-color: rgba(140, 200, 220, 0.15);
      }

      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 8px;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 12px 15px;
        border-radius: 10px;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        color: var(--text-primary);
        font-family: "Poppins", sans-serif;
      }
      .form-group input:focus,
      .form-group textarea:focus {
        border-color: var(--accent);
        outline: none;
      }

      .btn-submit {
        width: 100%;
        padding: 14px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-family: "Poppins", sans-serif;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
      }
      .btn-submit:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
      }

      .loading-state {
        text-align: center;
        padding: 100px 20px;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid var(--card-border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <header class="glass-header">
      <div class="logo">
        <h1>SYDF</h1>
        <p>Swat Youth Development Forum</p>
      </div>
      <nav></nav>
    </header>

    <section class="form-hero" id="formHero">
      <div class="loading-state">
        <div class="spinner"></div>
        <h2>Loading Form...</h2>
      </div>
    </section>

    <div class="form-container" id="formContainer" style="display: none">
      <form id="dynamicForm">
        <div id="fieldsWrapper"></div>
        <button type="submit" class="btn-submit" id="submitBtn">
          Submit Form
        </button>
      </form>
    </div>

    <footer class="glass-footer"></footer>

    <script src="js/main.js"></script>
    <script>
      let formData = null;
      let formFields = [];

      window.addEventListener("load", async () => {
        let attempts = 0;
        while (
          (typeof supabaseClient === "undefined" || !supabaseClient) &&
          attempts < 30
        ) {
          await new Promise((r) => setTimeout(r, 100));
          attempts++;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const formId = urlParams.get("id");

        if (!formId) {
          document.getElementById("formHero").innerHTML =
            `<h1>Form Not Found</h1><p>No form specified.</p>`;
          return;
        }

        try {
          const { data: form } = await supabaseClient
            .from("dynamic_forms")
            .select("*")
            .eq("id", formId)
            .eq("is_active", true)
            .single();
          if (!form) throw new Error("Form not found");

          const { data: fields } = await supabaseClient
            .from("form_fields")
            .select("*")
            .eq("form_id", formId)
            .order("sort_order");

          formData = form;
          formFields = fields || [];

          // Render Hero
          document.getElementById("formHero").innerHTML = `
            <h1>${form.title}</h1>
            <p style="color: var(--text-secondary); font-size: 16px;">${form.description || ""}</p>
          `;

          // Render Form
          const wrapper = document.getElementById("fieldsWrapper");
          wrapper.innerHTML = formFields
            .map((f) => {
              const req = f.is_required ? "required" : "";
              const star = f.is_required
                ? '<span style="color:#ef4444;">*</span>'
                : "";

              if (f.field_type === "textarea") {
                return `<div class="form-group"><label>${f.label} ${star}</label><textarea id="field_${f.id}" rows="4" ${req}></textarea></div>`;
              }
              return `<div class="form-group"><label>${f.label} ${star}</label><input type="${f.field_type}" id="field_${f.id}" ${req}></div>`;
            })
            .join("");

          document.getElementById("formContainer").style.display = "block";

          // Submit Handler
          document
            .getElementById("dynamicForm")
            .addEventListener("submit", async (e) => {
              e.preventDefault();
              const btn = document.getElementById("submitBtn");
              btn.innerText = "Submitting...";
              btn.disabled = true;

              const submissionData = {};
              formFields.forEach((f) => {
                submissionData[f.label] = document.getElementById(
                  `field_${f.id}`,
                ).value;
              });

              const {
                data: { session },
              } = await supabaseClient.auth.getSession();
              const submittedBy = session ? session.user.email : "Guest";

              const { error } = await supabaseClient
                .from("form_submissions")
                .insert([
                  {
                    form_id: formId,
                    data: submissionData,
                    submitted_by: submittedBy,
                  },
                ]);

              if (error) {
                alert("❌ Error submitting form: " + error.message);
                btn.innerText = "Submit Form";
                btn.disabled = false;
              } else {
                document.getElementById("formContainer").innerHTML = `
                <div style="text-align: center; padding: 40px 20px;">
                  <div style="font-size: 60px; margin-bottom: 20px;">✅</div>
                  <h2 style="color: var(--accent); margin-bottom: 10px;">Form Submitted Successfully!</h2>
                  <p style="color: var(--text-secondary);">Thank you for your response. We will get back to you soon.</p>
                  <a href="index.html" style="display:inline-block; margin-top:20px; color: var(--accent); text-decoration:none; font-weight:600;">← Back to Home</a>
                </div>
              `;
              }
            });
        } catch (err) {
          console.error(err);
          document.getElementById("formHero").innerHTML =
            `<h1>Form Not Found</h1><p>This form does not exist or is currently closed.</p>`;
        }
      });
    </script>
  </body>
</html>
