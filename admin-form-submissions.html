<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Submissions - SYDF Admin</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/pages/dashboard.css" />
    <link rel="stylesheet" href="css/pages/admin.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
      .table-card {
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(225, 29, 72, 0.15);
        border-radius: 16px;
        overflow-x: auto;
        margin-bottom: 20px;
      }
      html[data-theme="dark"] .table-card {
        background: rgba(12, 24, 42, 0.55);
        border-color: rgba(140, 200, 220, 0.15);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th,
      td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--card-border);
        font-size: 13px;
        color: var(--text-primary);
        white-space: nowrap;
      }
      th {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 11px;
      }
      tr:hover {
        background: rgba(0, 0, 0, 0.02);
      }
      html[data-theme="dark"] tr:hover {
        background: rgba(255, 255, 255, 0.02);
      }

      .btn-export {
        padding: 10px 20px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn-export:hover {
        background: var(--accent-hover);
      }
    </style>
  </head>
  <body class="dashboard-body">
    <aside class="dashboard-sidebar admin-sidebar" id="dashboardSidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <h1>SYDF</h1>
          <p>Admin Panel</p>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-title">Main</div>
        <ul>
          <li>
            <a href="admin.html"
              ><span class="nav-icon">📊</span><span>Dashboard</span></a
            >
          </li>
        </ul>
        <div class="nav-section-title">Content</div>
        <ul>
          <li>
            <a href="admin-forms.html"
              ><span class="nav-icon">📝</span><span>Form Builder</span></a
            >
          </li>
        </ul>
        <div class="nav-section-title">System</div>
        <ul></ul>
      </nav>
    </aside>

    <main class="dashboard-main">
      <div class="dashboard-topbar">
        <div class="topbar-title">
          <h2>Form Submissions</h2>
          <p id="formTitleSub">Loading...</p>
        </div>
      </div>

      <div class="dashboard-content">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
          "
        >
          <a
            href="admin-forms.html"
            style="
              color: var(--accent);
              text-decoration: none;
              font-weight: 600;
              font-size: 14px;
            "
            >← Back to Forms</a
          >
          <button class="btn-export" onclick="exportToCSV()">
            📥 Export to Excel (CSV)
          </button>
        </div>

        <div class="table-card" id="tableWrapper">
          <div
            style="
              padding: 40px;
              text-align: center;
              color: var(--text-secondary);
            "
          >
            Loading submissions...
          </div>
        </div>
      </div>
    </main>

    <script src="js/main.js?v=99"></script>
    <script>
      let currentForm = null;
      let currentFields = [];
      let currentSubmissions = [];

      async function loadSubmissions() {
        const urlParams = new URLSearchParams(window.location.search);
        const formId = urlParams.get("id");
        const wrapper = document.getElementById("tableWrapper");

        if (!formId) {
          wrapper.innerHTML = `<div style="padding: 40px; text-align: center; color: var(--text-secondary);">No form ID provided.</div>`;
          return;
        }

        // 1. Form Details
        const { data: form } = await supabaseClient
          .from("dynamic_forms")
          .select("title")
          .eq("id", formId)
          .single();
        if (form) {
          document.getElementById("formTitleSub").innerText = form.title;
          currentForm = form;
        }

        // 2. Form Fields (to know columns)
        const { data: fields } = await supabaseClient
          .from("form_fields")
          .select("*")
          .eq("form_id", formId)
          .order("sort_order");
        currentFields = fields || [];

        // 3. Submissions
        const { data: subs, error } = await supabaseClient
          .from("form_submissions")
          .select("*")
          .eq("form_id", formId)
          .order("created_at", { ascending: false });
        currentSubmissions = subs || [];

        if (error) {
          wrapper.innerHTML = `<div style="padding: 40px; text-align: center; color: #ef4444;">Error loading submissions.</div>`;
          return;
        }

        if (currentSubmissions.length === 0) {
          wrapper.innerHTML = `<div style="padding: 60px 20px; text-align: center; color: var(--text-secondary);"><div style="font-size:48px; opacity:0.3; margin-bottom:10px;">📭</div><h3>No Submissions Yet</h3><p>Responses will appear here once users fill the form.</p></div>`;
          return;
        }

        // Render Table
        let tableHTML = `<table><thead><tr><th>Date</th><th>Submitted By</th>`;
        currentFields.forEach((f) => {
          tableHTML += `<th>${f.label}</th>`;
        });
        tableHTML += `</tr></thead><tbody>`;

        currentSubmissions.forEach((sub) => {
          const date = new Date(sub.created_at).toLocaleString();
          tableHTML += `<tr><td>${date}</td><td>${sub.submitted_by}</td>`;

          currentFields.forEach((f) => {
            let val = sub.data[f.label];
            if (val === undefined || val === null || val === "") val = "-";
            // If it's a long text, truncate for table view but keep full in title
            const displayVal =
              String(val).length > 50
                ? String(val).substring(0, 50) + "..."
                : val;
            tableHTML += `<td title="${val}">${displayVal}</td>`;
          });
          tableHTML += `</tr>`;
        });
        tableHTML += `</tbody></table>`;

        wrapper.innerHTML = tableHTML;
      }

      window.exportToCSV = () => {
        if (currentSubmissions.length === 0) return alert("No data to export.");

        const headers = [
          "Date",
          "Submitted By",
          ...currentFields.map((f) => f.label),
        ];
        const rows = currentSubmissions.map((sub) => {
          const row = [
            new Date(sub.created_at).toLocaleString(),
            sub.submitted_by,
          ];
          currentFields.forEach((f) => {
            row.push(sub.data[f.label] || "");
          });
          return row;
        });

        const csvContent = [headers, ...rows]
          .map((e) =>
            e.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(","),
          )
          .join("\n");
        const blob = new Blob([csvContent], {
          type: "text/csv;charset=utf-8;",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${currentForm ? currentForm.title : "form"}-submissions.csv`;
        link.click();
        URL.revokeObjectURL(url);
      };

      window.addEventListener("load", async () => {
        let attempts = 0;
        while (
          (typeof supabaseClient === "undefined" || !supabaseClient) &&
          attempts < 30
        ) {
          await new Promise((r) => setTimeout(r, 100));
          attempts++;
        }
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();
        if (!session) window.location.href = "admin-login.html";
        else loadSubmissions();
      });
    </script>
  </body>
</html>
