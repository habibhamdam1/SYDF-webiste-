<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volunteers - SYDF Admin</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/pages/dashboard.css" />
    <link rel="stylesheet" href="css/pages/admin.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
      .table-card { 
        background: rgba(255,255,255,0.75); 
        border: 1px solid rgba(225,29,72,0.15); 
        border-radius: 16px; 
        overflow-x: auto; 
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      html[data-theme="dark"] .table-card { 
        background: rgba(12,24,42,0.55); 
        border-color: rgba(140,200,220,0.15); 
      }
      table { width: 100%; border-collapse: collapse; text-align: left; }
      th, td { padding: 14px 16px; border-bottom: 1px solid var(--card-border); font-size: 13px; color: var(--text-primary); }
      th { background: var(--accent-soft); color: var(--accent); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
      tr:hover { background: rgba(0,0,0,0.02); }
      html[data-theme="dark"] tr:hover { background: rgba(255,255,255,0.02); }
      
      .skill-tag { 
        display: inline-block; 
        background: rgba(26,188,156,0.15); 
        color: #1abc9c; 
        padding: 3px 8px; 
        border-radius: 6px; 
        font-size: 11px; 
        margin: 2px; 
        font-weight: 600;
      }
      .btn-delete { 
        background: rgba(239,68,68,0.15); 
        color: #ef4444; 
        border: 1px solid rgba(239,68,68,0.3); 
        padding: 6px 10px; 
        border-radius: 6px; 
        cursor: pointer; 
        transition: 0.3s;
      }
      .btn-delete:hover { background: #ef4444; color: white; }
    </style>
  </head>
  <body class="dashboard-body">
    <aside class="dashboard-sidebar admin-sidebar" id="dashboardSidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><h1>SYDF</h1><p>Admin Panel</p></div>
        <button class="sidebar-close" id="sidebarClose">✕</button>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-title">Main</div>
        <ul>
          <li><a href="admin.html"><span class="nav-icon">📊</span><span>Dashboard</span></a></li>
        </ul>
        <div class="nav-section-title">Members</div>
        <ul>
          <li><a href="admin-members.html"><span class="nav-icon">👥</span><span>All Members</span></a></li>
          <!-- Volunteers Link Auto-Inject Hoga main.js se -->
        </ul>
        <div class="nav-section-title">System</div>
        <ul></ul>
      </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="dashboard-main">
      <div class="dashboard-topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="topbar-title">
          <h2>Volunteers</h2>
          <p>Manage volunteer applications</p>
        </div>
        <div class="topbar-actions">
          <div class="topbar-user">
            <div class="user-avatar admin-avatar" id="topAvatar">A</div>
            <div class="user-info">
              <span class="user-name">Admin</span>
              <span class="user-uid" id="topRole">Super Admin</span>
            </div>
          </div>
        </div>
      </div>

      <div class="dashboard-content">
        <div class="page-header-block" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
          <div class="page-header-info">
            <h1 style="color: var(--text-primary);">🙋 Volunteer Directory</h1>
            <p style="color: var(--text-secondary); opacity: 0.75;">Total <strong id="totalVolunteers">0</strong> applications received</p>
          </div>
        </div>

        <div class="table-card" id="tableWrapper">
          <div style="padding: 40px; text-align: center; color: var(--text-secondary);">Loading volunteers...</div>
        </div>
      </div>
    </main>

    <script src="js/main.js?v=99"></script>
    <script>
      async function loadVolunteers() {
        const wrapper = document.getElementById('tableWrapper');
        
        const { data, error } = await supabaseClient
          .from('volunteers')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          wrapper.innerHTML = `<div style="padding: 40px; text-align: center; color: #ef4444;">Error: ${error.message}</div>`;
          return;
        }

        document.getElementById('totalVolunteers').textContent = data.length;

        if (data.length === 0) {
          wrapper.innerHTML = '<div style="padding: 60px 20px; text-align: center; color: var(--text-secondary);"><div style="font-size:48px; opacity:0.3; margin-bottom:10px;">📭</div><h3>No Volunteers Yet</h3><p>Applications will appear here.</p></div>';
          return;
        }

        let html = `
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Name / Contact</th>
                <th>Location</th>
                <th>Skills & Interests</th>
                <th>Availability</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
        `;
        
        data.forEach(v => {
          const date = new Date(v.created_at).toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric' });
          const skillsHtml = (v.skills || []).map(s => `<span class="skill-tag">${s}</span>`).join('');
          
          html += `
            <tr>
              <td>${date}</td>
              <td>
                <strong>${v.name}</strong><br>
                <small style="color:var(--text-secondary);">${v.email}</small><br>
                <small style="color:var(--text-secondary);">${v.phone || '-'}</small>
              </td>
              <td>${v.district}${v.tehsil ? ', ' + v.tehsil : ''}</td>
              <td>${skillsHtml || '<span style="opacity:0.5;">None</span>'}</td>
              <td>${v.availability || '-'}</td>
              <td>
                <button onclick="deleteVolunteer(${v.id})" class="btn-delete" title="Delete">🗑️</button>
              </td>
            </tr>
          `;
        });
        
        html += `</tbody></table>`;
        wrapper.innerHTML = html;
      }

      window.deleteVolunteer = async (id) => {
        if (!confirm('Are you sure you want to delete this volunteer application?')) return;
        
        const { error } = await supabaseClient.from('volunteers').delete().eq('id', id);
        if (error) {
          alert("❌ Error: " + error.message);
          return;
        }
        
        alert('🗑️ Deleted successfully');
        loadVolunteers();
      };

      window.addEventListener('load', async () => {
        let attempts = 0;
        while ((typeof supabaseClient === "undefined" || !supabaseClient) && attempts < 30) {
          await new Promise(r => setTimeout(r, 100)); 
          attempts++;
        }
        
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
          window.location.href = "admin-login.html";
          return;
        }

        // Fetch Admin Info
        const { data: admin } = await supabaseClient
          .from("members")
          .select("name, role")
          .eq("email", session.user.email)
          .single();
          
        if (admin) {
          document.getElementById("topAvatar").textContent = (admin.name || "A").charAt(0).toUpperCase();
          document.querySelectorAll(".user-name").forEach(el => el.textContent = admin.name);
          document.getElementById("topRole").textContent = admin.role;
        }

        loadVolunteers();
      });
    </script>
  </body>
</html>
