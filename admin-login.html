<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - SYDF</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <style>
      .admin-login-body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      }

      .admin-login-card {
        max-width: 450px;
        width: 100%;
        padding: 45px 40px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      }

      .admin-login-header {
        text-align: center;
        margin-bottom: 35px;
      }

      .admin-shield {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        box-shadow: 0 10px 30px rgba(251, 191, 36, 0.4);
      }

      .admin-login-header h1 {
        font-size: 26px;
        font-weight: 700;
        color: white;
        margin-bottom: 8px;
      }

      .admin-login-header p {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.7);
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
        opacity: 0.9;
        color: white;
      }

      .form-group input {
        width: 100%;
        padding: 14px 16px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        color: white;
        font-family: "Poppins", sans-serif;
        font-size: 14px;
        outline: none;
        transition: 0.3s;
      }

      .form-group input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      .form-group input:focus {
        border-color: #fbbf24;
        background: rgba(251, 191, 36, 0.08);
        box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.15);
      }

      .password-wrapper {
        position: relative;
      }

      .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        font-size: 18px;
        cursor: pointer;
        opacity: 0.7;
        padding: 5px;
      }

      .btn-admin-login {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        color: #1a1a1a;
        border: none;
        border-radius: 12px;
        font-family: "Poppins", sans-serif;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
      }

      .btn-admin-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 35px rgba(251, 191, 36, 0.4);
      }

      .btn-admin-login:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .message-box {
        display: none;
        padding: 14px 16px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 13px;
        line-height: 1.6;
      }

      .message-box.error {
        display: block;
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fca5a5;
      }

      .message-box.success {
        display: block;
        background: rgba(26, 188, 156, 0.15);
        border: 1px solid rgba(26, 188, 156, 0.4);
        color: #1abc9c;
      }

      .back-link {
        text-align: center;
        margin-top: 25px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.7);
      }

      .back-link a {
        color: #1abc9c;
        text-decoration: none;
        font-weight: 600;
      }

      .back-link a:hover {
        text-decoration: underline;
      }

      .security-note {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 15px;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.3);
        border-radius: 10px;
        margin-top: 20px;
        font-size: 11px;
        color: #93c5fd;
        line-height: 1.6;
      }
    </style>
  </head>
  <body class="admin-login-body">
    <div class="admin-login-card">
      <div class="admin-login-header">
        <div class="admin-shield">🛡️</div>
        <h1>Admin Login</h1>
        <p>Restricted Access - SYDF Staff Only</p>
      </div>

      <div class="message-box" id="messageBox"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminEmail">Admin Email *</label>
          <input
            type="email"
            id="adminEmail"
            placeholder="admin@SYDF.org"
            required
          />
        </div>

        <div class="form-group">
          <label for="adminPassword">Password *</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="adminPassword"
              placeholder="Enter password"
              required
            />
            <button type="button" class="toggle-password" id="togglePassword">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn-admin-login" id="adminLoginBtn">
          🔐 Login to Admin Panel
        </button>
      </form>

      <div class="security-note">
        <span>🔒</span>
        <span>This is a secure area. All login attempts are logged.</span>
      </div>

      <div class="back-link">
        <a href="login.html">← Back to Member Login</a>
      </div>
    </div>

    <script>
      window.addEventListener("load", function () {
        const form = document.getElementById("adminLoginForm");
        const messageBox = document.getElementById("messageBox");
        const btn = document.getElementById("adminLoginBtn");

        function showMessage(text, type) {
          messageBox.textContent = text;
          messageBox.className = "message-box " + type;
          messageBox.style.display = "block";
        }

        // Password toggle
        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("adminPassword");
        togglePassword.addEventListener("click", function () {
          const type =
            passwordInput.getAttribute("type") === "password"
              ? "text"
              : "password";
          passwordInput.setAttribute("type", type);
          this.textContent = type === "password" ? "👁️" : "🙈";
        });

        form.addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("adminEmail").value.trim();
          const password = document.getElementById("adminPassword").value;

          if (!email || !password) {
            showMessage("❌ Please enter both email and password.", "error");
            return;
          }

          const originalText = btn.textContent;
          btn.textContent = "Verifying...";
          btn.disabled = true;

          try {
            // Step 1: Login
            const { data: authData, error: authError } =
              await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
              });

            if (authError) {
              showMessage(
                "❌ Invalid credentials: " + authError.message,
                "error",
              );
              btn.textContent = originalText;
              btn.disabled = false;
              return;
            }

            // Step 2: Check admin role
            const { data: member, error: memberError } = await supabaseClient
              .from("members")
              .select("role, name, status")
              .eq("email", email)
              .single();

            if (memberError || !member) {
              await supabaseClient.auth.signOut();
              showMessage(
                "❌ Access Denied: You are not registered as admin.",
                "error",
              );
              btn.textContent = originalText;
              btn.disabled = false;
              return;
            }

            const adminRoles = [
              "Super Admin",
              "Admin",
              "President",
              "Senior Vice President",
              "Vice President",
              "Secretary General",
            ];

            if (!adminRoles.includes(member.role)) {
              await supabaseClient.auth.signOut();
              showMessage(
                "❌ Access Denied: You do not have admin privileges. Current role: " +
                  member.role,
                "error",
              );
              btn.textContent = originalText;
              btn.disabled = false;
              return;
            }

            // Success
            showMessage(
              "✅ Welcome, " + member.name + "! Redirecting...",
              "success",
            );

            localStorage.setItem("SYDF_admin_email", email);
            localStorage.setItem("SYDF_admin_role", member.role);

            setTimeout(function () {
              window.location.replace("admin.html");
            }, 1000);
          } catch (err) {
            showMessage("❌ Error: " + err.message, "error");
            btn.textContent = originalText;
            btn.disabled = false;
          }
        });
      });
    </script>
    <script src="js/admin-data.js"></script>
  </body>
</html>
