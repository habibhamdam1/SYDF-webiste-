<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Pages - SYDF Admin</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/pages/dashboard.css" />
    <link rel="stylesheet" href="css/pages/admin.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
      .page-card {
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(225, 29, 72, 0.15);
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 20px;
      }
      html[data-theme="dark"] .page-card {
        background: rgba(12, 24, 42, 0.55);
        border-color: rgba(140, 200, 220, 0.15);
      }
      .page-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid var(--card-border);
      }
      .page-row:last-child {
        border-bottom: none;
      }
      .page-info h4 {
        color: var(--text-primary);
        font-size: 15px;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .page-info p {
        color: var(--text-secondary);
        font-size: 12px;
      }
      .badge {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 700;
      }
      .badge.published {
        background: rgba(26, 188, 156, 0.15);
        color: #1abc9c;
      }
      .badge.draft {
        background: rgba(245, 158, 11, 0.15);
        color: #f59e0b;
      }

      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 9999;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .modal-overlay.active {
        display: flex;
      }
      .modal-box {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        padding: 30px;
        border-radius: 20px;
        width: 100%;
        max-width: 600px;
        max-height: 90vh;
        overflow-y: auto;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 6px;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        color: var(--text-primary);
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body class="dashboard-body">
    <aside class="dashboard-sidebar admin-sidebar" id="dashboardSidebar">
      <!-- Sidebar (main.js will inject links) -->
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <h1>SYDF</h1>
          <p>Admin Panel</p>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-title">Main</div>
        <ul>
          <li>
            <a href="admin.html"
              ><span class="nav-icon">📊</span><span>Dashboard</span></a
            >
          </li>
        </ul>
        <div class="nav-section-title">Content</div>
        <ul>
          <li>
            <a href="admin-news.html"
              ><span class="nav-icon">📰</span><span>News</span></a
            >
          </li>
          <li>
            <a href="admin-activities.html"
              ><span class="nav-icon">🎯</span><span>Activities</span></a
            >
          </li>
          <li>
            <a href="admin-custom-pages.html" class="active"
              ><span class="nav-icon">📄</span><span>Custom Pages</span></a
            >
          </li>
        </ul>
        <div class="nav-section-title">System</div>
        <ul></ul>
      </nav>
    </aside>

    <main class="dashboard-main">
      <div class="dashboard-topbar">
        <div class="topbar-title">
          <h2>Custom Pages</h2>
          <p>Create and manage dynamic website pages</p>
        </div>
      </div>

      <div class="dashboard-content">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
          "
        >
          <h3 style="color: var(--text-primary)">All Pages</h3>
          <button
            onclick="openPageModal()"
            style="
              padding: 10px 20px;
              background: var(--accent);
              color: #fff;
              border: none;
              border-radius: 10px;
              font-weight: 600;
              cursor: pointer;
            "
          >
            + Create Page
          </button>
        </div>

        <div class="page-card" id="pagesList">
          <div
            style="
              padding: 40px;
              text-align: center;
              color: var(--text-secondary);
            "
          >
            Loading...
          </div>
        </div>
      </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="pageModal">
      <div class="modal-box">
        <h3 style="color: var(--accent); margin-bottom: 20px" id="modalTitle">
          Create New Page
        </h3>
        <input type="hidden" id="editId" />

        <div class="form-group">
          <label>Page Title</label>
          <input
            type="text"
            id="pageTitle"
            placeholder="e.g., Scholarship Program"
            oninput="generateSlug()"
          />
        </div>
        <div class="form-group">
          <label>URL Slug (Auto-generated or custom)</label>
          <input
            type="text"
            id="pageSlug"
            placeholder="e.g., scholarship-program"
          />
          <small
            style="
              color: var(--text-secondary);
              font-size: 11px;
              margin-top: 4px;
              display: block;
            "
            >Website par link aise khulega: page.html?slug=your-slug</small
          >
        </div>
        <div class="form-group">
          <label>Content (HTML or Text)</label>
          <textarea
            id="pageContent"
            rows="10"
            placeholder="Enter page content here..."
          ></textarea>
        </div>
        <div
          class="form-group"
          style="display: flex; align-items: center; gap: 10px"
        >
          <input type="checkbox" id="pagePublished" checked />
          <label style="margin: 0">Publish immediately</label>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 25px">
          <button
            onclick="
              document.getElementById('pageModal').classList.remove('active')
            "
            style="
              flex: 1;
              padding: 12px;
              border-radius: 10px;
              background: rgba(255, 255, 255, 0.1);
              color: var(--text-primary);
              border: 1px solid var(--card-border);
              cursor: pointer;
            "
          >
            Cancel
          </button>
          <button
            onclick="savePage()"
            style="
              flex: 1;
              padding: 12px;
              border-radius: 10px;
              background: var(--accent);
              color: #fff;
              border: none;
              font-weight: 600;
              cursor: pointer;
            "
          >
            Save Page
          </button>
        </div>
      </div>
    </div>

    <script src="js/main.js?v=99"></script>
    <script>
      async function loadPages() {
        const list = document.getElementById("pagesList");
        list.innerHTML =
          '<div style="padding: 40px; text-align: center; color: var(--text-secondary);">Loading...</div>';

        const { data, error } = await supabaseClient
          .from("custom_pages")
          .select("*")
          .order("created_at", { ascending: false });

        if (error || !data) return (list.innerHTML = "Error loading pages.");
        if (data.length === 0)
          return (list.innerHTML =
            '<div style="padding: 40px; text-align: center; color: var(--text-secondary);">No pages created yet.</div>');

        list.innerHTML = data
          .map(
            (page) => `
          <div class="page-row">
            <div class="page-info">
              <h4>
                ${page.title} 
                <span class="badge ${page.is_published ? "published" : "draft"}">${page.is_published ? "Published" : "Draft"}</span>
              </h4>
              <p>URL: page.html?slug=${page.slug}</p>
            </div>
            <div style="display: flex; gap: 8px;">
              <a href="page.html?slug=${page.slug}" target="_blank" class="btn-icon" style="text-decoration:none; display:flex; align-items:center; justify-content:center;" title="View Page">👁️</a>
              <button class="btn-icon" onclick="editPage(${JSON.stringify(page).replace(/"/g, "&quot;")})" title="Edit">✏️</button>
              <button class="btn-icon delete" onclick="deletePage(${page.id})" title="Delete">🗑️</button>
            </div>
          </div>
        `,
          )
          .join("");
      }

      window.generateSlug = () => {
        const title = document.getElementById("pageTitle").value;
        document.getElementById("pageSlug").value = title
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-|-$)/g, "");
      };

      window.openPageModal = () => {
        document.getElementById("modalTitle").innerText = "Create New Page";
        document.getElementById("editId").value = "";
        document.getElementById("pageTitle").value = "";
        document.getElementById("pageSlug").value = "";
        document.getElementById("pageContent").value = "";
        document.getElementById("pagePublished").checked = true;
        document.getElementById("pageModal").classList.add("active");
      };

      window.editPage = (page) => {
        document.getElementById("modalTitle").innerText = "Edit Page";
        document.getElementById("editId").value = page.id;
        document.getElementById("pageTitle").value = page.title;
        document.getElementById("pageSlug").value = page.slug;
        document.getElementById("pageContent").value = page.content || "";
        document.getElementById("pagePublished").checked = page.is_published;
        document.getElementById("pageModal").classList.add("active");
      };

      window.savePage = async () => {
        const id = document.getElementById("editId").value;
        const payload = {
          title: document.getElementById("pageTitle").value.trim(),
          slug: document.getElementById("pageSlug").value.trim(),
          content: document.getElementById("pageContent").value,
          is_published: document.getElementById("pagePublished").checked,
          updated_at: new Date().toISOString(),
        };

        if (!payload.title || !payload.slug)
          return alert("Title and Slug are required.");

        if (id) {
          await supabaseClient
            .from("custom_pages")
            .update(payload)
            .eq("id", id);
        } else {
          await supabaseClient.from("custom_pages").insert([payload]);
        }

        document.getElementById("pageModal").classList.remove("active");
        loadPages();
      };

      window.deletePage = async (id) => {
        if (!confirm("Move this page to Recycle Bin?")) return;
        await supabaseClient.from("custom_pages").delete().eq("id", id);
        loadPages();
      };

      window.addEventListener("load", async () => {
        let attempts = 0;
        while (
          (typeof supabaseClient === "undefined" || !supabaseClient) &&
          attempts < 30
        ) {
          await new Promise((r) => setTimeout(r, 100));
          attempts++;
        }
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();
        if (!session) window.location.href = "admin-login.html";
        else loadPages();
      });
    </script>
  </body>
</html>
