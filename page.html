<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page - SYDF</title>
    <script src="js/head-includes.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
      .page-hero { padding: 140px 20px 60px; text-align: center; max-width: 800px; margin: 0 auto; }
      .page-hero h1 { font-family: "Playfair Display", serif; font-size: 48px; color: var(--accent); margin-bottom: 15px; }
      
      .content-section { max-width: 900px; margin: 0 auto 80px; padding: 40px; background: rgba(255,255,255,0.75); border: 1px solid rgba(225,29,72,0.15); border-radius: 20px; backdrop-filter: blur(10px); }
      html[data-theme="dark"] .content-section { background: rgba(12,24,42,0.55); border-color: rgba(140,200,220,0.15); }
      
      .content-section p { font-size: 16px; line-height: 1.9; color: var(--text-primary); margin-bottom: 20px; }
      .content-section h2 { font-family: "Playfair Display", serif; font-size: 28px; color: var(--accent); margin: 30px 0 15px; }
      .content-section h3 { font-size: 22px; color: var(--text-primary); margin: 25px 0 12px; }
      .content-section ul, .content-section ol { margin: 20px 0 20px 30px; color: var(--text-primary); line-height: 1.8; }
      .content-section a { color: var(--accent); }
      
      .loading-state { text-align: center; padding: 100px 20px; }
      .spinner { width: 50px; height: 50px; border: 4px solid var(--card-border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <header class="glass-header">
      <div class="logo"><h1>SYDF</h1><p>Swat Youth Development Forum</p></div>
      <nav></nav>
    </header>

    <section class="page-hero" id="pageHero">
      <div class="loading-state">
        <div class="spinner"></div>
        <h2>Loading...</h2>
      </div>
    </section>

    <section class="content-section" id="pageContent" style="display:none;"></section>

    <footer class="glass-footer"></footer>

    <script src="js/main.js"></script>
    <script>
      window.addEventListener('load', async () => {
        let attempts = 0;
        while ((typeof supabaseClient === "undefined" || !supabaseClient) && attempts < 30) {
          await new Promise(r => setTimeout(r, 100)); attempts++;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');

        if (!slug) {
          document.getElementById('pageHero').innerHTML = `<h1>Page Not Found</h1><p>No page specified.</p>`;
          return;
        }

        try {
          const { data, error } = await supabaseClient
            .from('custom_pages')
            .select('*')
            .eq('slug', slug)
            .eq('is_published', true)
            .is('deleted_at', null)
            .single();

          if (error || !data) {
            document.getElementById('pageHero').innerHTML = `<div style="font-size:64px; opacity:0.5; margin-bottom:20px;">📄</div><h1>Page Not Found</h1><p>This page does not exist or is not published yet.</p><a href="index.html" style="color:var(--accent); text-decoration:none; font-weight:600;">← Back to Home</a>`;
            return;
          }

          // Set SEO Title
          document.title = data.title + " - SYDF";
          if (data.meta_description) {
            const meta = document.createElement('meta');
            meta.name = "description";
            meta.content = data.meta_description;
            document.head.appendChild(meta);
          }

          // Render Hero
          document.getElementById('pageHero').innerHTML = `<h1>${data.title}</h1>`;

          // Render Content
          const contentBox = document.getElementById('pageContent');
          contentBox.style.display = 'block';
          
          // If content has HTML tags, use innerHTML, else format text into paragraphs
          if (/<[a-z][\s\S]*>/i.test(data.content)) {
             contentBox.innerHTML = data.content;
          } else {
             contentBox.innerHTML = data.content.split(/\n\n+/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
          }

        } catch (err) {
          console.error(err);
          document.getElementById('pageHero').innerHTML = `<h1>Error</h1><p>Something went wrong while loading the page.</p>`;
        }
      });
    </script>
  </body>
</html>
